<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇大战 - 双人对战</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .test-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: rgba(15, 15, 26, 0.95);
            border: 2px solid var(--color-player1);
            border-radius: 10px;
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--color-player1);
            box-shadow: var(--glow-player1);
            z-index: 10000;
        }
        
        .test-status.error {
            border-color: var(--color-player2);
            color: var(--color-player2);
            box-shadow: var(--glow-player2);
        }
    </style>
</head>
<body>
    <div class="test-status" id="test-status">🔄 正在测试...</div>
    
    <div id="app">
        <div id="main-menu" class="screen active">
            <div class="logo-container">
                <h1 class="glitch-text" data-text="贪吃蛇大战">贪吃蛇大战</h1>
                <p class="subtitle">SNAKE BATTLE</p>
            </div>
            
            <div class="menu-buttons">
                <button class="neon-btn primary pulse" id="btn-create-room">
                    <span class="icon">🎮</span>
                    <span>创建房间</span>
                </button>
                <button class="neon-btn secondary" id="btn-join-room">
                    <span class="icon">🚪</span>
                    <span>加入房间</span>
                </button>
            </div>
            
            <div class="player-info">
                <div class="player-avatar">
                    <div class="avatar-ring"></div>
                    <span class="avatar-icon">🐍</span>
                </div>
                <div class="player-details">
                    <span class="player-id" id="player-id">等待连接...</span>
                    <span class="connection-status" id="connection-status">⚫ 未连接</span>
                </div>
            </div>
            
            <div class="controls-guide">
                <div class="control-item">
                    <span class="key">W A S D</span>
                    <span class="label">玩家1 控制</span>
                </div>
                <div class="control-item">
                    <span class="key">↑ ← ↓ →</span>
                    <span class="label">玩家2 控制</span>
                </div>
            </div>
        </div>

        <div id="room-menu" class="screen">
            <div class="room-header">
                <button class="back-btn" id="btn-back-menu">← 返回</button>
                <h2>游戏房间</h2>
            </div>
            
            <div class="room-code-display" id="room-code-display">
                <span class="label">房间码</span>
                <div class="code-container">
                    <span class="room-code" id="room-code">------</span>
                    <button class="copy-btn" id="btn-copy-code" title="复制房间码">📋</button>
                </div>
            </div>
            
            <div class="players-container">
                <div class="player-slot" id="player-slot-1">
                    <div class="slot-indicator"></div>
                    <span class="slot-label">等待玩家...</span>
                </div>
                <div class="vs-divider">VS</div>
                <div class="player-slot" id="player-slot-2">
                    <div class="slot-indicator"></div>
                    <span class="slot-label">等待玩家...</span>
                </div>
            </div>
            
            <div class="waiting-animation" id="waiting-animation" style="display: none;">
                <div class="loading-ring"></div>
                <p>等待其他玩家加入...</p>
            </div>
            
            <button class="neon-btn ready-btn" id="btn-ready" style="display: none;">
                <span>准备就绪</span>
            </button>
        </div>

        <div id="join-menu" class="screen">
            <div class="room-header">
                <button class="back-btn" id="btn-back-from-join">← 返回</button>
                <h2>加入房间</h2>
            </div>
            
            <div class="join-form">
                <div class="input-group">
                    <label>房间码</label>
                    <input type="text" id="input-room-code" maxlength="6" placeholder="输入6位房间码" class="neon-input">
                </div>
                <div class="input-group">
                    <label>密码 (可选)</label>
                    <input type="password" id="input-password" placeholder="房间密码" class="neon-input">
                </div>
                <button class="neon-btn primary" id="btn-confirm-join">加入房间</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-hud">
                <div class="hud-player player-1">
                    <div class="player-name">玩家 1</div>
                    <div class="player-score" id="score-player-1">0</div>
                    <div class="player-status" id="status-player-1">存活</div>
                </div>
                <div class="game-timer" id="game-timer">00:00</div>
                <div class="hud-player player-2">
                    <div class="player-name">玩家 2</div>
                    <div class="player-score" id="score-player-2">0</div>
                    <div class="player-status" id="status-player-2">等待</div>
                </div>
            </div>
            
            <div class="game-container">
                <canvas id="game-canvas"></canvas>
                <div class="game-overlay" id="game-overlay">
                    <div class="overlay-content">
                        <h2 id="overlay-title">游戏即将开始</h2>
                        <p id="overlay-message">等待服务器...</p>
                    </div>
                </div>
            </div>
            
            <div class="mobile-controls" id="mobile-controls">
                <div class="control-row">
                    <button class="mobile-btn" data-dir="up">▲</button>
                </div>
                <div class="control-row">
                    <button class="mobile-btn" data-dir="left">◀</button>
                    <button class="mobile-btn" data-dir="down">▼</button>
                    <button class="mobile-btn" data-dir="right">▶</button>
                </div>
            </div>
            
            <div class="game-controls">
                <button class="neon-btn small" id="btn-pause">暂停</button>
                <button class="neon-btn small secondary" id="btn-quit-game">退出</button>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <div class="result-container">
                <h1 class="result-title" id="result-title">胜利!</h1>
                <div class="result-icon" id="result-icon">🏆</div>
                
                <div class="result-stats">
                    <div class="stat-item">
                        <span class="stat-label">存活时间</span>
                        <span class="stat-value" id="stat-time">00:00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">最终长度</span>
                        <span class="stat-value" id="stat-length">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">获得食物</span>
                        <span class="stat-value" id="stat-food">0</span>
                    </div>
                </div>
                
                <div class="result-buttons">
                    <button class="neon-btn primary" id="btn-play-again">再来一局</button>
                    <button class="neon-btn secondary" id="btn-back-main">返回主页</button>
                </div>
            </div>
        </div>
    </div>

    <div class="particle-container" id="particles"></div>
    
    <script src="js/network.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                const status = document.getElementById('test-status');
                if (status) {
                    const connectionStatus = document.getElementById('connection-status');
                    if (connectionStatus && connectionStatus.textContent.includes('已连接')) {
                        status.textContent = '✅ 服务器连接成功';
                        status.classList.remove('error');
                        setTimeout(() => status.style.display = 'none', 3000);
                    } else {
                        status.textContent = '⚠️ 等待服务器连接...';
                        setTimeout(() => {
                            if (connectionStatus && connectionStatus.textContent.includes('已连接')) {
                                status.textContent = '✅ 服务器连接成功';
                                status.classList.remove('error');
                                setTimeout(() => status.style.display = 'none', 3000);
                            } else {
                                status.textContent = '⚠️ 请启动服务器 (npm start)';
                                status.classList.add('error');
                            }
                        }, 2000);
                    }
                }
            }, 1000);
        });
    </script>
</body>
</html>
